<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Direction A — Warm Paper</title><style>
:root{--bg:#F4EFE6;--surface:#FBF8F2;--raised:#FFFFFF;--border:#E3DACB;--ink:#2A2521;--ink-2:#5F564C;--ink-3:#8C8175;--accent:#B4532A;--low:#3F6B4B;--mod:#B07515;--high:#A83A2C;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px}
.phone{width:400px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:baseline;justify-content:space-between}
.wm{font-size:22px;font-weight:700;letter-spacing:-.02em}.wm span{color:var(--accent)}
.meta{font-size:13px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.hero{background:var(--raised);border-radius:20px;padding:24px 22px;box-shadow:0 1px 2px rgba(42,37,33,.06),0 8px 24px -12px rgba(42,37,33,.18);border:1px solid var(--border)}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.level{font-size:52px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:10px 0 2px;color:var(--mod)}
.wait{font-size:22px;font-weight:600;color:var(--ink)}
.fresh{margin-top:14px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--low)}
.track{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:18px}
.seg{height:8px;border-radius:99px;background:var(--border)}.seg.on{background:var(--mod)}
.segl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;font-size:12px;color:var(--ink-3);font-weight:600}
.segl b{color:var(--mod)}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.thumb{width:56px;height:56px;border-radius:10px;background:#E8DFD0;flex:none}
.name{font-size:17px;font-weight:600}.sub{font-size:14px;color:var(--ink-3);margin-top:3px}
.price{margin-left:auto;font-size:17px;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:#EDE5D6;color:var(--ink-2);margin-right:6px}
.sw{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.sw div{height:40px;flex:1}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:12px 18px;border-radius:10px}
</style></head><body><div class="phone">
<div class="top"><div class="wm">U<span>Bite</span></div><div class="meta">Warm paper</div></div>
<div class="hero"><div class="eyebrow">Queue right now</div><div class="level">Moderate</div><div class="wait">about 6 minutes</div>
<div class="track"><div class="seg"></div><div class="seg on"></div><div class="seg"></div></div>
<div class="segl"><span>Low</span><b>Moderate</b><span>High</span></div>
<div class="fresh"><span class="dot"></span>Updated 40s ago</div></div>
<div class="card"><div class="eyebrow" style="margin-bottom:6px">Today · Main course</div>
<div class="row"><div class="thumb"></div><div><div class="name">Ciorbă de perișoare</div><div class="sub"><span class="tag">Contains gluten</span></div></div><div class="price">9 lei</div></div>
<div class="row" style="border:0"><div class="thumb"></div><div><div class="name">Pui la cuptor cu cartofi</div><div class="sub"><span class="tag">High protein</span></div></div><div class="price">17 lei</div></div>
<div style="margin-top:14px"><span class="btn">See full menu</span></div></div>
<div class="sw"><div style="background:var(--bg)"></div><div style="background:var(--surface)"></div><div style="background:var(--accent)"></div><div style="background:var(--low)"></div><div style="background:var(--mod)"></div><div style="background:var(--high)"></div><div style="background:var(--ink)"></div></div>
</div></body></html>
