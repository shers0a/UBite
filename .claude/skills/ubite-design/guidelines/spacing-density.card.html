<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div style="display:flex;flex-direction:column;background:var(--surface);border-radius:10px;overflow:hidden">
<div style="padding:var(--density-zone-1) 14px;background:var(--surface-raised);font-size:14px;display:flex;justify-content:space-between"><span>Zone 1 · Coada acum</span><span class="lbl">--density-zone-1</span></div><div style="padding:var(--density-zone-2) 14px;background:var(--surface);font-size:14px;display:flex;justify-content:space-between"><span>Zone 2 · Meniul de azi</span><span class="lbl">--density-zone-2</span></div><div style="padding:var(--density-zone-3) 14px;background:var(--surface-raised);font-size:14px;display:flex;justify-content:space-between"><span>Zone 3 · Fidelitate</span><span class="lbl">--density-zone-3</span></div><div style="padding:var(--density-zone-4) 14px;background:var(--surface);font-size:14px;display:flex;justify-content:space-between"><span>Zone 4 · Cât ai așteptat</span><span class="lbl">--density-zone-4</span></div><div style="padding:var(--density-zone-5) 14px;background:var(--surface-raised);font-size:14px;display:flex;justify-content:space-between"><span>Zone 5 · Tipar orar</span><span class="lbl">--density-zone-5</span></div><div style="padding:var(--density-zone-6) 14px;background:var(--surface);font-size:14px;display:flex;justify-content:space-between"><span>Zone 6 · Anunțuri</span><span class="lbl">--density-zone-6</span></div><div style="padding:var(--density-zone-7) 14px;background:var(--surface-raised);font-size:14px;display:flex;justify-content:space-between"><span>Zone 7 · Footer</span><span class="lbl">--density-zone-7</span></div></div></body></html>
