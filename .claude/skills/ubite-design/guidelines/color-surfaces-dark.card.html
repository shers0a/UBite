<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — dark" subtitle="The same token names, redefined. Dark is not a second stylesheet." -->
<!DOCTYPE html><html lang="ro" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{border-radius:10px;overflow:hidden}.s .chip{height:64px}.s .n{font-size:12px;font-weight:600;margin-top:6px}.s .v{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">Sunken</div><div class="v mono">--surface-sunken</div></div><div class="s"><div class="chip" style="background:var(--surface-page)"></div><div class="n">Page</div><div class="v mono">--surface-page</div></div><div class="s"><div class="chip" style="background:var(--surface)"></div><div class="n">Surface · elev 1</div><div class="v mono">--surface</div></div><div class="s"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">Raised · elev 2</div><div class="v mono">--surface-raised</div></div></div></body></html>
