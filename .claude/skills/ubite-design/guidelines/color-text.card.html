<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div class="g" style="background:var(--surface);padding:14px;border-radius:10px">
<div style="font-size:20px;font-weight:600;color:var(--text-primary)">Coada e mică, cam 3 minute</div>
<div style="font-size:16px;color:var(--text-secondary)">Aștepți cam 3 minute la casă.</div>
<div style="font-size:14px;color:var(--text-muted)" class="mono">actualizat acum 40s</div>
<div style="display:flex;gap:10px;margin-top:4px"><span class="lbl">--text-primary</span><span class="lbl">--text-secondary</span><span class="lbl">--text-muted</span></div></div></body></html>
