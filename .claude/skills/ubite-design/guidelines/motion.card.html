<!-- @dsCard group="Motion" viewport="700x180" name="Durations" subtitle="150–250ms. Two places earn motion: the level changing and a dot filling." -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div class="g">
<div style="display:flex;gap:10px;align-items:center"><span class="lbl" style="width:120px">--motion-fast</span><div style="height:8px;width:90px;background:var(--accent);border-radius:4px"></div><span style="font-size:13px">150ms · apăsare, hover</span></div>
<div style="display:flex;gap:10px;align-items:center"><span class="lbl" style="width:120px">--motion-base</span><div style="height:8px;width:120px;background:var(--accent);border-radius:4px"></div><span style="font-size:13px">200ms · implicit</span></div>
<div style="display:flex;gap:10px;align-items:center"><span class="lbl" style="width:120px">--motion-slow</span><div style="height:8px;width:150px;background:var(--accent);border-radius:4px"></div><span style="font-size:13px">250ms · schimbarea nivelului, bulina de fidelitate</span></div>
<p style="font-size:12px;color:var(--text-muted);margin-top:4px">prefers-reduced-motion dezactivează complet tranzițiile — nu le scurtează.</p></div></body></html>
