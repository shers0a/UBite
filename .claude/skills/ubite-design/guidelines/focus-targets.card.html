<!-- @dsCard group="Motion" viewport="700x200" name="Focus and touch targets" subtitle="A designed 3px ring with a contrast halo; 44px minimum everywhere" -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<button style="height:44px;padding:0 16px;border:0;border-radius:6px;background:var(--accent);color:var(--text-on-accent);font:inherit;font-weight:600;outline:3px solid var(--focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-ring-contrast)">Focus vizibil</button>
<span style="display:inline-grid;place-items:center;width:44px;height:44px;border-radius:6px;background:var(--surface-raised);outline:3px solid var(--focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-ring-contrast)">44</span>
<div style="position:relative;width:44px;height:44px;border-radius:6px;background:var(--surface-raised);display:grid;place-items:center"><span style="width:20px;height:20px;border-radius:4px;background:var(--border-strong)"></span></div>
<span style="font-size:13px;color:var(--text-secondary);max-width:30ch">Glifa poate fi de 20px, dar ținta rămâne 44×44. Aceeași regulă servește și kiosk-ul.</span></div></body></html>
