<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Two levels, both by colour value. Shadow belongs only to things that float." -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="background:var(--surface-page);padding:16px;border-radius:10px"><div class="lbl">Elevation 0</div><div style="font-size:14px;margin-top:6px">Pagina</div></div>
<div style="background:var(--surface);padding:16px;border-radius:10px"><div class="lbl">Elevation 1</div><div style="font-size:14px;margin-top:6px">Card, secțiune, rând</div></div>
<div style="background:var(--surface-raised);padding:16px;border-radius:16px"><div class="lbl">Elevation 2</div><div style="font-size:14px;margin-top:6px">Indicatorul de coadă, sheet</div></div></div>
<div style="margin-top:12px;background:var(--surface-raised);padding:14px;border-radius:10px;box-shadow:var(--shadow-overlay);font-size:14px">--shadow-overlay · doar pentru sheet și dialog</div></body></html>
