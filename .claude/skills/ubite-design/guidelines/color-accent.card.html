<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="One blue. Buttons, links, focus, the wordmark plate — nothing decorative." -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{border-radius:10px;overflow:hidden}.s .chip{height:64px}.s .n{font-size:12px;font-weight:600;margin-top:6px}.s .v{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--accent)"></div><div class="n">Accent</div><div class="v mono">--accent</div></div><div class="s"><div class="chip" style="background:var(--accent-hover)"></div><div class="n">Hover</div><div class="v mono">--accent-hover</div></div><div class="s"><div class="chip" style="background:var(--accent-active)"></div><div class="n">Active</div><div class="v mono">--accent-active</div></div><div class="s"><div class="chip" style="background:var(--accent-quiet)"></div><div class="n">Quiet</div><div class="v mono">--accent-quiet</div></div></div></body></html>
