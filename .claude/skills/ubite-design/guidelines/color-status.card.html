<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Success, warning, danger, offline — each with a quiet ground and an accessible ink" -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{border-radius:10px;overflow:hidden}.s .chip{height:64px}.s .n{font-size:12px;font-weight:600;margin-top:6px}.s .v{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--status-success-quiet);display:grid;place-items:center;color:var(--status-success-text);font-weight:600">trimis</div><div class="n">Success</div></div>
<div class="s"><div class="chip" style="background:var(--status-warning-quiet);display:grid;place-items:center;color:var(--status-warning-text);font-weight:600">aproximativ</div><div class="n">Warning</div></div>
<div class="s"><div class="chip" style="background:var(--status-danger-quiet);display:grid;place-items:center;color:var(--status-danger-text);font-weight:600">eroare</div><div class="n">Danger</div></div>
<div class="s"><div class="chip" style="background:var(--status-offline-fill);display:grid;place-items:center;color:var(--status-offline-text);font-weight:600">offline</div><div class="n">Offline</div></div></div></body></html>
