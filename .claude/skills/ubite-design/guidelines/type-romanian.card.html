<!-- @dsCard group="Type" viewport="700x180" name="Romanian runs longer" subtitle="15–20% more characters than English. Nothing may be designed to a tight box." -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:var(--surface);padding:12px;border-radius:10px"><div class="lbl">Română</div><div style="font-size:16px;margin-top:6px">Informație indisponibilă despre alergeni</div><div style="font-size:16px">Încă una și masa e gratuită</div><div style="font-size:16px">Cât ai așteptat la coadă?</div></div>
<div style="background:var(--surface);padding:12px;border-radius:10px"><div class="lbl">English</div><div style="font-size:16px;margin-top:6px">Allergen information not available</div><div style="font-size:16px">One more for a free meal</div><div style="font-size:16px">How long did you wait?</div></div></div>
<p style="font-size:12px;color:var(--text-muted);margin-top:10px">Diacriticele ă â î ș ț cer subsetul latin-ext — este inclus în @font-face.</p></body></html>
