<!-- @dsCard group="Type" viewport="700x170" name="Numerals" subtitle="Tabular lining figures everywhere a number ticks or a column aligns" -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}</style>
</head><body><div class="mono" style="font-size:34px;font-weight:700;letter-spacing:-.01em">11:30 · 17:00 &nbsp; 9 lei · 17 lei &nbsp; ~6 min</div>
<div style="display:grid;grid-template-columns:1fr auto;max-width:280px;margin-top:12px;font-size:16px" class="mono">
<span>Ciorbă de perișoare</span><span style="font-weight:700">9 lei</span>
<span>Pui la cuptor</span><span style="font-weight:700">17 lei</span>
<span>Salată de varză</span><span style="font-weight:700">4 lei</span></div>
<div class="lbl" style="margin-top:10px">class="ub-numeric" → font-variant-numeric: tabular-nums lining-nums</div></body></html>
