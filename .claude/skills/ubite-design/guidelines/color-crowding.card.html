<!-- @dsCard group="Colors" viewport="700x190" name="Crowding states — light" subtitle="Cool to warm. The only place colour carries meaning — and never alone." -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}.mono{font-variant-numeric:tabular-nums}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{border-radius:10px;overflow:hidden}.s .chip{height:64px}.s .n{font-size:12px;font-weight:600;margin-top:6px}.s .v{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="sw" style="grid-template-columns:repeat(3,1fr)">
<div class="s"><div class="chip" style="background:var(--crowd-low-quiet);display:grid;place-items:center;color:var(--crowd-low-text);font-size:22px;font-weight:700">Mică</div><div class="n">Low</div><div class="v mono">--crowd-low-*</div></div>
<div class="s"><div class="chip" style="background:var(--crowd-moderate-quiet);display:grid;place-items:center;color:var(--crowd-moderate-text);font-size:22px;font-weight:700">Medie</div><div class="n">Moderate</div><div class="v mono">--crowd-moderate-*</div></div>
<div class="s"><div class="chip" style="background:var(--crowd-high-quiet);display:grid;place-items:center;color:var(--crowd-high-text);font-size:22px;font-weight:700">Mare</div><div class="n">High</div><div class="v mono">--crowd-high-*</div></div></div>
<p style="font-size:12px;color:var(--text-muted);margin-top:10px">Culoarea nu apare niciodată singură: cuvântul e obligatoriu, iar contorul de siluete adaugă un al treilea indiciu.</p></body></html>
