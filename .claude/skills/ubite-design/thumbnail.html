<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
.t{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px}
.main{background:#1F4FD8;display:grid;place-items:center}
.lock{display:flex;align-items:center}
.plate{background:#fff;color:#1F4FD8;font-family:var(--font-sans);font-weight:800;font-size:250px;line-height:1;letter-spacing:-.02em;padding:24px 42px;border-radius:70px}
.tail{color:#fff;font-family:var(--font-sans);font-weight:700;font-size:250px;line-height:1;letter-spacing:-.04em;margin-left:26px}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head><body>
<div class="t">
  <div class="main"><span class="lock"><span class="plate">UB</span><span class="tail">ite</span></span></div>
  <div class="strip">
    <i style="background:#C47A0A"></i>
    <i style="background:#D1512F"></i>
    <i style="background:#128A6B"></i>
    <i style="background:#11161B"></i>
  </div>
</div>
</body></html>
