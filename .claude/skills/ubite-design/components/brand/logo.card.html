<!-- @dsCard group="Brand" viewport="700x320" name="Logo — U + Bite" subtitle="The chosen lockup, counters filling with the queue level, app icon and favicon" -->
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px;background:var(--surface-page)}.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--text-muted);margin:0 0 8px}.sec{margin-bottom:18px}.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.dark{background:#0D1116;border-radius:12px;padding:12px 16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Logo, Wordmark } = window.UBiteDesignSystem_40c8c2;
function Card(){
  const [level,setLevel]=React.useState('moderate');
  React.useEffect(()=>{const seq=['low','moderate','high','closed'];let i=1;
    const t=setInterval(()=>{setLevel(seq[i%4]);i++;},1800);return()=>clearInterval(t);},[]);
  return (<>
    <div className="sec"><p className="lbl">Lockup · contoarele urmăresc nivelul cozii ({level})</p>
      <div className="row">
        <Logo variant="tray" size={72} level={level} tone="level" withText />
        <span style={{ background: 'var(--accent)', borderRadius: 12, padding: '12px 16px' }}><Logo variant="tray" size={40} level={level} tone="on-accent" withText /></span>
      </div></div>
    <div className="sec"><p className="lbl">Iconița aplicației · favicon (doar U) · monocrom</p>
      <div className="row">
        <Wordmark size={64} variant="mark" />
        <Wordmark size={40} variant="mark" />
        <Logo variant="tray" size={20} favicon level={level} />
        <Logo variant="tray" size={30} tone="mono" level={level} withText />
      </div></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
