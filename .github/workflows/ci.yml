# CI and release (docs/12, docs/24).
# Every pull request and every push to main: typecheck, lint, tests, build, assets, the production
# dependencies' audit, and both images built. On main only, the images that passed are published to
# ghcr.io, signed with cosign keyless (the certificate names this file, refs/heads/main and the commit)
# and given a build provenance attestation. The UB VM pulls them on its own (deploy/cd.sh) and runs
# nothing that this workflow did not sign on main; it deploys outside 11:00–17:30 on weekdays.
# Actions are pinned by commit; Dependabot keeps the pins current.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs on main queue in order, so `main` on ghcr.io never moves back to an older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Signing and deploying depend on this one condition.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  COSIGN_VERSION: v3.1.4

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run assets:check
      # What ships in the image: no known high or critical vulnerability gets deployed.
      - run: npm audit --omit=dev --audit-level=high

  images:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write     # push to ghcr.io (main only)
      id-token: write     # cosign keyless and the attestation (main only)
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: ubite
            context: .
          - name: ubite-vision
            context: services/vision
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          # One plain image manifest (Podman 4.9 on the VM); provenance comes from the attestation below.
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          # `main` moves only in the release job, once both images are signed.
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the image by digest
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "\`$IMAGE\`"
            echo
            echo "Signed by \`.github/workflows/ci.yml@refs/heads/main\` for commit \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Both images of this commit are published and signed: point `main` at them. The VM watches
  # ubite:main, so it never sees a commit whose counter image is missing. A carbon copy of the
  # manifest keeps the digest, and with it the signature.
  release:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move main to this commit
        env:
          BASE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          for name in ubite ubite-vision; do
            docker buildx imagetools create --prefer-index=false --tag "$BASE/$name:main" "$BASE/$name:sha-$SHA"
            a=$(docker buildx imagetools inspect --raw "$BASE/$name:sha-$SHA" | sha256sum | cut -d' ' -f1)
            b=$(docker buildx imagetools inspect --raw "$BASE/$name:main" | sha256sum | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$name:main is not a carbon copy of sha-$SHA"; exit 1; }
            echo "$name:main → sha256:$a"
          done
          echo "\`main\` now points to \`${SHA:0:7}\`. The UB VM deploys it within 5 minutes, or at 17:30 if it is a weekday lunch (deploy/cd.sh)." >> "$GITHUB_STEP_SUMMARY"
